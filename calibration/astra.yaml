# ASTRA Analysis Specification

spec_version: "0.1.0"
label: "calibration"
description: >-
  Each of drift-study's sensors calibrated against the study's reference,
  FRPDAS, over an initial window: a gain and an offset fitted to the
  sensor's daily means against the reference's, or an offset alone, and the
  sensor's readings for the whole year corrected with them. Freiburg's other
  stations are calibrated against FRPDAS the same way, as what siting alone
  puts into a calibration. Built where drift-study drives it, which selects
  the window, the model and the study's screening.

analyses:
  study:
    path: ..
  noise:
    url: https://github.com/tomcharnock-lightcone/noise-models
    commit: df53934304bc2abedc11eea60311fae783f17625

decisions:
  window:
    label: Calibration window
    rationale: >-
      A calibration fitted at deployment is what a network has to go on
      afterwards, so the window is the start of each sensor's record. A
      longer one fits more days and a wider range of temperatures, which a
      gain needs: over 2023's first two weeks FRPDAS's daily mean ran only
      from 6.6 to 14.9 °C, over January from −1.4 to 14.9 °C. But the longer
      the window, the more of the drift it is meant to reveal happens inside
      it, and the less of the year is left to see it in.
    options:
      two_weeks:
        label: Two weeks
        description: The first 14 days of the sensor's record.
      one_month:
        label: One month
        description: The first calendar month of the sensor's record.
      three_months:
        label: Three months
        description: The first three calendar months of the sensor's record.

  model:
    label: Calibration model
    rationale: >-
      A sensor can read off by a constant (offset), or by an amount that
      grows with temperature (gain), or both. The gain, if a sensor has one,
      puts the seasonal cycle into its difference from the reference, and
      where the year is not symmetric about its middle, part of that cycle
      into a fitted drift; an offset cannot move a drift fitted with an
      offset of its own. Whether there is a gain worth fitting is what the
      two options are compared for. Against a station elsewhere, though, a
      gain is also how differently the two sites follow the weather.
    options:
      offset_only:
        label: Offset only
        description: >-
          s = r + o: each reading corrected by the mean difference over the
          window.
      gain_and_offset:
        label: Gain and offset
        description: >-
          s = g·r + o, by least squares of the difference on the reference's
          temperature: each reading corrected to (s − o)/g.

outputs:
  coefficients:
    label: Calibration per sensor
    type: table
    format: csv
    description: >-
      One row per sensor (kind = sensor) and per other Freiburg station with
      enough measured days in the window (kind = station), fitted to the
      difference from FRPDAS over the window, d = s − r = α + β·(r − r̄):
      name, model, window, window_start, window_last, n_days; gain
      (g = 1 + β; 1 for an offset alone) with gain_se and its 95% interval
      (gain_ci95_low/high), and the two parts gain_se adds in quadrature,
      gain_se_residual (for AR(1) residuals, Santer et al. 2000) and
      gain_se_noise_model (the sensor's chamber noise model through the
      fit's weights; none for a station); offset_c (o = α − β·r̄, so that a
      calibrated reading is (s − o)/g); bias_c (α, the mean difference over
      the window) and bias_se_c, from the residuals; reference_mean_c (r̄);
      residual_sd_c, residual_lag1_autocorr and n_effective. A sensor's
      window starts on its first day in the study's table and it is fitted
      on the days the study uses; a station's starts on the table's first
      day, on the days whose 24 hours are all measured at it and at FRPDAS,
      and it is listed only if those are at least two thirds of the
      window's days.
    inputs: [study.differences, study.reference_daily, noise.noise_models#hann_slope_one]
    decisions: [window, model]
    recipe:
      command: >-
        python src/calibrate.py {inputs.study.differences}
        {inputs.study.reference_daily} FRPDAS {inputs.noise.noise_models#hann_slope_one}
        {decisions.window} {decisions.model} {output}

  calibrated:
    label: Sensor-days, calibrated
    type: table
    format: csv
    description: >-
      The study's table of sensor-days with each sensor's daily mean
      calibrated, sensor_mean_c = (s − o)/g, and difference_c recomputed from
      it; beside them raw_sensor_mean_c (s), in_window (the day lies in the
      calibration window) and the sensor's gain, gain_se and offset_c. Which
      days are used, and why the others are not, is the study's.
    inputs: [study.differences, coefficients]
    recipe:
      command: >-
        python src/apply_calibration.py {inputs.study.differences}
        {inputs.coefficients} {output}
