findings:
  sensors_drift_upward:
    claim: >-
      Against FRPDAS, the sensors drifted upward over 2023 as a group: their
      median drift is +0.42 °C per year (drift linear in time), and 24 of the
      40 sensors have a 95% interval that excludes zero, with the residuals'
      and the noise models' errors added.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_drift_c_per_year": 0.4159' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 24' }

  reference_stable:
    claim: >-
      FRPDAS shows no significant drift against the median of Freiburg's
      other stations over 2023: +0.11 °C per year, 95% interval −0.09 to
      +0.31. The sensors' drifts are not the reference's.
    evidence:
      - artifact: reference_check
        quote: { exact: '"drift_c_per_year": 0.1058' }
      - artifact: reference_check
        quote: { exact: '"drift_ci95_low_c_per_year": -0.0943' }

  siting_floor:
    claim: >-
      Maintained Freiburg stations show apparent linear drifts against FRPDAS
      over 2023 from −0.43 to +0.43 °C per year (5th–95th percentile), from
      their sites alone. A sensor's drift inside that range cannot be told
      apart from where it stands, unless it is co-located with FRPDAS.
    evidence:
      - artifact: reference_check
        quote: { exact: '"drift_p05_c_per_year": -0.4279' }
      - artifact: reference_check
        quote: { exact: '"drift_p95_c_per_year": 0.4347' }

  temperature_term_matters:
    claim: >-
      Allowing a temperature-dependent bias moves the sensors' drifts by a
      median of 0.11 °C per year and by up to 0.37 °C per year (s22), and
      lowers the median drift to +0.34 °C per year: for the sensors whose
      difference follows the seasons, how drift is separated from a
      temperature dependence matters about as much as the drift's
      uncertainty, up to 1.1 of its standard error.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1099' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.3706' }
      - artifact: universe_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 1.116' }

  screening_choices_immaterial:
    claim: >-
      Counting FRPDAS's gap-filled days, or lowering the sensor-day coverage
      threshold to 90%, changes no sensor's drift by more than 0.02 °C per
      year, at most a tenth of its standard error. Either choice can be
      made.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0196' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0121' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 0.104' }

  both_error_sources_matter:
    claim: >-
      Neither the residuals nor the sensors' noise models alone account for
      the drift's uncertainty. Taken alone, the residual errors are a median
      0.55 of the combined ones and the noise-model errors 0.83, and with
      either alone more sensors' drifts would pass for significant: 34 or 30
      of 40, against 24 with both.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 0.553' }
      - artifact: universe_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 0.833' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 34' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 30' }

  offset_calibration_changes_nothing:
    claim: >-
      Calibrating each sensor's offset alone, over any of the three windows,
      changes no sensor's drift: a drift fitted with an offset of its own
      cannot see a constant correction.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0,' }

  sensors_have_gains:
    claim: >-
      Many sensors follow the reference's temperature with a gain other than
      1: calibrated over January, 18 of the 40 have a gain whose 95%
      interval excludes 1, and their gains run from 0.96 to 1.05 (5th–95th
      percentile). The gain is not an accident of the window: over the
      sensors it correlates at 0.91 with the temperature coefficient fitted
      to the whole year, and calibrating it out shrinks the median sensor's
      residual scatter over the year by a sixth.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_gain_ci95_excluding_one": 18' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_p05": 0.9629' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_p95": 1.054' }
      - artifact: calibration_comparison
        quote: { exact: '"gain_vs_temperature_coefficient_corr": 0.906' }
      - artifact: calibration_comparison
        quote: { exact: '"median_residual_sd_ratio_to_baseline": 0.839' }

  gains_not_only_the_sensors:
    claim: >-
      Part of a sensor's gain against FRPDAS is its site. Calibrated against
      FRPDAS over January, Freiburg's other, maintained stations show gains
      as widely spread as the sensors' (standard deviation 0.031 against
      0.030). Over three months the stations' spread narrows to 0.020 while
      the sensors' stays at 0.027, and 20 of the 40 sensors' gains differ
      from 1 against 5 of the 39 stations': some sensors have a gain beyond
      what siting gives.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"station_gain_sd": 0.0311' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_sd": 0.0296' }
      - artifact: calibration_comparison
        quote: { exact: '"station_gain_sd": 0.0195' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_sd": 0.0272' }
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_gain_ci95_excluding_one": 20' }
      - artifact: calibration_comparison
        quote: { exact: '"n_stations_gain_ci95_excluding_one": 5' }

  gain_calibration_moves_drift:
    claim: >-
      Calibrating a gain and an offset over January moves the sensors'
      drifts by a median of 0.13 °C per year and by up to 0.43 °C per year
      (s23), 1.8 of the baseline's standard error, and lowers the median
      drift from +0.42 to +0.35 °C per year, close to the temperature term's
      +0.34: a gain from January takes out much of the seasonal pattern the
      whole year's temperature term does. With it, 23 of the 40 sensors
      drift significantly, against 24 without.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1345' }
      - artifact: calibration_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.4282' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_of_max": "s23"' }
      - artifact: calibration_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 1.759' }
      - artifact: calibration_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3472' }
      - artifact: universe_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 23' }

  calibration_window:
    claim: >-
      Two weeks is too short to calibrate a gain, and a month is enough. The
      sensors' gains are known to a median standard error of 0.024 from two
      weeks, 0.011 from a month and 0.009 from three; carried into the
      drift, the two-week gain's uncertainty adds a median 0.14 °C per year
      to its error and widens it by a fifth, the month's 0.07. Three months
      move the drifts much as one does, by a median of 0.13 °C per year.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_median_se": 0.0236' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_median_se": 0.0107' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_median_se": 0.0086' }
      - artifact: calibration_comparison
        quote: { exact: '"median_drift_se_calibration_c_per_year": 0.142' }
      - artifact: calibration_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 1.209' }
      - artifact: calibration_comparison
        quote: { exact: '"median_drift_se_calibration_c_per_year": 0.0654' }
      - artifact: calibration_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1267' }

  battery_swaps_found:
    claim: >-
      The archive's battery voltage shows three battery swaps in 2023: s02
      on 2 March, s20 on 9 June and s34 on 14 September, each in the course
      of the day. They are where those sensors' differences from FRPDAS
      step.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"n_swaps": 3' }
      - artifact: robust_comparison
        quote: { exact: '"dates": "s02:2023-03-02;s20:2023-06-09;s34:2023-09-14"' }

  settling_is_the_gain:
    claim: >-
      Fitted with a step at each battery swap but the gain left in, s02's
      and s34's residuals stay off zero for weeks after their swaps, a jump
      that seems to settle: over the 28 days from the swap they average
      −0.17 and +0.39 °C. That is not the swap but each sensor's gain
      following the spring's warming and the autumn's cooling, which a step
      cannot follow. With the gain taken out by the temperature term, the
      residuals of every swapped sensor average within 0.05 °C of zero over
      the 28 days either side of its swap, and the steps of s02 and s34 come
      out twice as large or more, −0.63 and +0.81 °C against −0.31 and
      +0.24. A step is enough; no settling needs modelling.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"s02_residual_after_swap_c": -0.174' }
      - artifact: robust_comparison
        quote: { exact: '"s34_residual_after_swap_c": 0.39' }
      - artifact: robust_comparison
        quote: { exact: '"s02_residual_after_swap_c": 0.025' }
      - artifact: robust_comparison
        quote: { exact: '"s20_residual_after_swap_c": 0.043' }
      - artifact: robust_comparison
        quote: { exact: '"s34_residual_after_swap_c": 0.041' }
      - artifact: robust_comparison
        quote: { exact: '"s02_steps_c": "-0.6347"' }
      - artifact: robust_comparison
        quote: { exact: '"s34_steps_c": "0.8054"' }
      - artifact: robust_comparison
        quote: { exact: '"s02_steps_c": "-0.3063"' }
      - artifact: robust_comparison
        quote: { exact: '"s34_steps_c": "0.2428"' }

  battery_steps_matter:
    claim: >-
      With the gain taken out by the temperature term, a step at each swap
      changes the drifts of the three swapped sensors and of hardly any
      other, by at most 0.026 °C per year with Huber's fit. s20's falls from
      +1.57 to +0.45 °C per year, its swap having stepped it by +0.80 °C:
      the largest drift in the network was mostly a battery swap. s34's
      turns from +0.70 to −0.42 °C per year: it drifted down, and its swap
      stepped it up by more. s02's goes from −0.74 to −0.27 °C per year.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"s20_counterpart_drift_c_per_year": 1.5664' }
      - artifact: robust_comparison
        quote: { exact: '"s20_drift_c_per_year": 0.4498' }
      - artifact: robust_comparison
        quote: { exact: '"s20_steps_c": "0.8032"' }
      - artifact: robust_comparison
        quote: { exact: '"s34_counterpart_drift_c_per_year": 0.6961' }
      - artifact: robust_comparison
        quote: { exact: '"s34_drift_c_per_year": -0.4204' }
      - artifact: robust_comparison
        quote: { exact: '"s02_counterpart_drift_c_per_year": -0.7415' }
      - artifact: robust_comparison
        quote: { exact: '"s02_drift_c_per_year": -0.2663' }
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_unstepped_vs_counterpart_c_per_year": 0.0256' }

  outliers_immaterial:
    claim: >-
      Outlying days do not drive the drifts. Huber's robust fit moves no
      sensor's drift by more than 0.044 °C per year, 0.28 of its standard
      error, and down-weights 14.5% of the days fitted, fewer than the 18%
      it would for Gaussian residuals: after the screening, the residuals
      have no heavy tail.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0444' }
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 0.276' }
      - artifact: robust_comparison
        quote: { exact: '"share_days_downweighted": 0.145' }

  robust_agrees:
    claim: >-
      The robust universe, with a step at each battery swap, the temperature
      term and Huber's fit, still finds the sensors drifting upward as a
      group: a median of +0.32 °C per year, against the baseline's +0.42 and
      the temperature term's +0.34 alone, and 25 of the 40 sensors
      significantly, against 24. Taking the gain out by the January
      calibration instead gives the same median, +0.32, with 22 significant.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3193' }
      - artifact: robust_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 25' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3223' }
      - artifact: robust_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 22' }
