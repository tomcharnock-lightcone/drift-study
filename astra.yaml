# ASTRA Analysis Specification

spec_version: "0.1.0"
label: "drift-study"
description: >-
  How far each of the city's 40 low-cost temperature sensors (s01 to s40)
  drifted over 2023. Each sensor's despiked daily mean, from sensor-archive
  (despiked at 3 °C, and at 1 °C for comparison), is compared with the daily
  mean air temperature of FRPDAS, a station of Freiburg's street-level
  weather network (Plein, Christen & Dormann,
  doi:10.5281/zenodo.21307957), and a linear drift is fitted per sensor to the
  daily difference: in the baseline, beside a bias proportional to the
  reference temperature and a free step at each battery swap, found in the
  archive's daily battery voltage, by a fit robust to outlying days. The
  simple fit, a line by least squares alone, is built for comparison, with
  each of those additions to it on its own. The station file is streamed
  from Zenodo and checked against its published MD5; only the daily means it
  gives are kept. Whether FRPDAS itself is stable, and how much apparent
  drift two maintained stations show against each other over one year, is
  checked against the rest of the Freiburg network. Whether calibrating each
  sensor against FRPDAS over an initial window, with an offset or a gain and
  an offset, changes the drift is checked with the calibration analysis in
  calibration/.

analyses:
  archive:
    url: https://github.com/tomcharnock-lightcone/sensor-archive
    commit: d32f0cf1b2cc5219402f6d49cefa7dc5fb313640
  noise:
    url: https://github.com/tomcharnock-lightcone/noise-models
    commit: df53934304bc2abedc11eea60311fae783f17625
  calibration:
    path: calibration
  v1:
    url: https://github.com/tomcharnock-lightcone/drift-study
    commit: 9e7861306eaf209e82a16ad4d42e8d9c7c3a5674

decisions:
  despike:
    label: Despiking threshold
    rationale: >-
      sensor-archive drops a reading that sits too far from the rolling
      median of the 31 readings around it, and builds a daily summary for
      each threshold (its decision of the same name). At 3 °C only the
      spikes go: ordinary readings stay within 2 °C of that median and the
      spikes lie beyond 4 °C. At 1 °C some ordinary readings go with them,
      about four times as many readings in all. A spike moves a day's mean
      little, but a threshold that eats into real change could bias it, so
      whether the threshold reaches the drift is checked.
    options:
      median3c:
        label: 3 °C
        description: >-
          sensor-archive's despiked summary (its universe despiked).
      median1c:
        label: 1 °C
        description: >-
          sensor-archive's summary despiked at 1 °C (its universe
          despiked_1c). Readings it drops still count as delivered for
          min_coverage, as at 3 °C.

  reference_hours:
    label: Reference hours
    rationale: >-
      The Freiburg file is gap-filled: an hour the station did not record is
      replaced by a model prediction and marked `type = predicted`. In 2023,
      13 of FRPDAS's 365 days hold at least one predicted hour, one of them
      all 24. A predicted hour is a model of the station, not a measurement,
      so comparing a sensor with it can pass the model's error to the sensor;
      leaving those days out costs 13 days a sensor.
    options:
      measured:
        label: Measured days only
        description: >-
          Only days whose 24 hourly values at FRPDAS are all measured.
      gap_filled:
        label: Gap-filled days too
        description: >-
          Every day, with the gap-filled hours as published.

  min_coverage:
    label: Sensor-day coverage
    rationale: >-
      A sensor-day missing part of its readings has a mean biased by
      whichever part of the daily cycle is missing, while the reference's
      mean covers the whole day; partial days in the 2023 summaries depart
      from their sensor's usual difference by up to several °C. A day counts
      as covered by the share of its 8640 ten-second readings delivered,
      readings despiking removed included (they are isolated single readings
      and leave no hole). Fewer than 1% of sensor-days fall below 99%, so the
      threshold mostly decides a few dozen days.
    options:
      p99:
        label: At least 99% of the day
      p90:
        label: At least 90% of the day
      any:
        label: Every day with readings
        excluded: >-
          Days with a small fraction of their readings give means several °C
          away from the day's true mean; they would enter the fit as outliers
          of known cause.

  drift_model:
    label: Drift model
    rationale: >-
      A drift is a change in a sensor's difference from the reference over
      time. But a sensor whose bias depends on temperature (a gain error, or
      radiative heating that grows on warm, sunny days) shows a seasonal cycle
      in its difference that is not drift; 2023 is not symmetric about
      mid-year, so part of that cycle projects onto a linear trend. Adding the
      reference temperature as a regressor separates the two, at the cost of
      a model that assumes the temperature dependence is linear and constant
      over the year.
    options:
      time_only:
        label: Linear in time
        description: >-
          d = a + b·t: the linear drift asked for, nothing else.
      time_and_temperature:
        label: Linear in time and in reference temperature
        description: >-
          d = a + b·t + c·(T_ref − T̄_ref): a linear drift plus a bias
          proportional to the reference temperature.

  drift_errors:
    label: Drift uncertainty
    rationale: >-
      Two things scatter a sensor's daily difference from the reference: the
      sensor's own noise, which noise-models measured in a climate chamber
      (white plus 1/f), and the two sites answering the weather differently,
      plus the reference's own noise. The residuals of the fit hold both,
      but an AR(1) model of them has short memory and misses how 1/f noise
      keeps wandering over months. The noise model has that memory but knows
      nothing of the sites, and reaches a year only by extending a week-long
      chamber run, at about 20 °C, three decades below its lowest fitted
      frequency. Neither is complete, so the baseline adds the two; each
      alone is built for comparison.
    options:
      residual_ar1:
        label: From the residuals
        description: >-
          Least-squares error scaled by the AR(1) effective sample size of
          the residuals (Santer et al. 2000); Student-t interval.
      noise_model:
        label: From the sensor's noise model
        description: >-
          The variance of the fitted drift under the sensor's chamber noise
          model (noise-models' default: Hann window, 1/f slope held at 1),
          propagated through the daily means and the fit's weights; Gaussian
          interval. Instrument noise only.
      combined:
        label: Both added
        description: >-
          The two variances added, and the interval half-widths in
          quadrature. The instrument's day-to-day noise is counted in both,
          so this errs wide.

  swap_steps:
    label: Battery swaps
    rationale: >-
      Some sensors had their battery swapped during 2023, which the
      archive's daily battery voltage shows: between swaps it only falls,
      and at a swap it jumps back to a fresh battery's. A swap is an event,
      not drift, yet the sensors' differences from the reference step at
      their swaps, up or down, as handling a sensor or a different
      battery's load can make them. A line fitted through a step reads it
      as drift. A free step at each swap takes it out, at the cost of a
      parameter, and of any real drift that came at the swap. A swap in
      spring or autumn falls where a sensor with a gain has its difference
      changing fastest with the season, which a step alone cannot follow, so
      the baseline fits the step together with the temperature term.
    options:
      none:
        label: No allowance
        description: One line through the whole year.
      at_swaps:
        label: A step at each swap
        description: >-
          A free step in the difference at each battery swap, from the first
          day read wholly on the new battery; the day of a swap within the
          day, whose mean mixes two batteries, is not used.

  fit_method:
    label: Fit
    rationale: >-
      Least squares lets a few days far from the line pull it, the more so
      the nearer they are to the year's ends. The screening removes the days
      known to be bad (stuck readings, partial days); a robust fit guards
      against those it cannot name.
    options:
      least_squares:
        label: Least squares
        description: Every used day counts by the square of its residual.
      huber:
        label: Huber's M-estimate
        description: >-
          A day more than 1.345 robust standard deviations from the fit
          counts in proportion to its distance rather than its square
          (src/drift_stats.py); errors from Huber's asymptotic covariance,
          with the same AR(1) effective sample size.

  calibrate:
    label: Calibration before the fit
    rationale: >-
      A drift is what changes in a sensor after it was set up. Calibrating
      each sensor against the reference over the start of its record
      removes what it read wrong from the start, so that the fit sees only
      what came later. An offset cannot change a drift fitted with an
      offset of its own; a gain can, by taking the seasonal cycle it causes
      out of the difference. The calibration's window and model are the
      calibration analysis's decisions, selected where this one is
      initial_window.
    options:
      none:
        label: None
        description: The sensors' daily means as the archive gives them.
      initial_window:
        label: Over an initial window
        description: >-
          Each sensor's daily means calibrated against FRPDAS over the start
          of its record (calibration analysis), with the gain's uncertainty
          carried into the drift's.

outputs:
  reference_daily:
    label: Freiburg stations' daily means, 2023
    type: table
    format: csv
    description: >-
      Daily mean air temperature (ta) of every station of the Freiburg
      street-level network for each UTC day of 2023, from the hourly file
      ta_vp_rh_60_min_2022_09_01_2024_08_31_gap_filled.csv of
      doi:10.5281/zenodo.21307957 (CC BY 4.0). The file is streamed whole and
      checked against its published MD5 (093ef1695526841b2ea5e66d800ca42e),
      and is not kept. Columns: date, station, ta_mean_c (mean of the day's
      hourly values, measured and gap-filled alike), n_hours, n_measured.
      Hourly timestamps are UTC and are assigned to the day they fall in.
    recipe:
      command: >-
        python src/reference_daily.py
        https://zenodo.org/api/records/21307957/files/ta_vp_rh_60_min_2022_09_01_2024_08_31_gap_filled.csv/content
        093ef1695526841b2ea5e66d800ca42e 2023 {output}

  battery_swaps:
    label: Battery swaps
    type: table
    format: csv
    description: >-
      One row per battery swap, a day on which sensor-archive's daily
      battery summary shows the voltage rising (between swaps it only
      falls): sensor, swap_date, v_before_v and v_after_v (the voltage
      either side), mixed (readings from both batteries share the day) and
      first_new_date (the first day read wholly on the new battery).
    inputs: [archive.daily_battery]
    recipe:
      command: python src/battery_swaps.py {inputs.archive.daily_battery} {output}

  sensor_summary:
    switch: despike
    cases:
      median3c: archive.daily_summary#despiked
      median1c: archive.daily_summary#despiked_1c

  differences:
    label: Sensor minus reference, per day
    type: table
    format: csv
    description: >-
      One row per sensor-day of the archive's despiked daily summary: date,
      sensor, sensor_mean_c, reference_mean_c (FRPDAS), difference_c,
      coverage (share of the day's 8640 readings delivered),
      reference_measured_hours, used, and excluded_reason for a day not used,
      by precedence: flatline (every reading the same value, a stuck sensor),
      flatline_adjacent (the day before or after one, which the summary
      cannot tell how much of was stuck), low_coverage, no_reference,
      reference_gap_filled, and battery_swap (under swap_steps at_swaps, a
      day the sensor's battery was swapped within).
    inputs: [sensor_summary, reference_daily, battery_swaps]
    decisions: [reference_hours, min_coverage, swap_steps]
    recipe:
      command: >-
        python src/differences.py {inputs.sensor_summary}
        {inputs.reference_daily} FRPDAS {decisions.reference_hours}
        {decisions.min_coverage} {inputs.battery_swaps}
        {decisions.swap_steps} {output}

  fit_input:
    switch: calibrate
    cases:
      none: differences
      initial_window: calibration.calibrated

  calibration_coefficients:
    switch: calibrate
    cases:
      initial_window: calibration.coefficients

  drift:
    label: Linear drift per sensor
    type: table
    format: csv
    description: >-
      One row per sensor, fitted to its used days (fit_method):
      drift_c_per_year (b, per 365.25 days) with drift_se_c_per_year and its
      95% interval (drift_ci95_low/high_c_per_year); offset_c (a, the
      difference at 2023-07-02) with offset_se_c; temp_coef_c_per_c and its
      error (c, under the temperature model only); residual_sd_c,
      residual_lag1_autocorr and n_effective; drift_ols_se_c_per_year, the
      unadjusted error, for comparison; n_days_used and the days excluded
      for each reason. The drift's error is given both ways in every table:
      drift_se_residual_c_per_year, for autocorrelated residuals by the
      effective sample size of an AR(1) process, n_e = n(1 − r₁)/(1 + r₁)
      (Santer et al. 2000, doi:10.1029/1999JD901105), with Student-t
      intervals on n_e − k degrees of freedom (Newey–West errors were tried
      and rejected: on simulated AR(1) residuals as persistent as these,
      their 95% intervals covered the true trend 80–90% of the time,
      tests/test_drift_stats.py); and drift_se_noise_model_c_per_year, from
      the sensor's noise model (src/noise_propagation.py). drift_errors picks
      which the quoted drift_se_c_per_year and interval use. Fitted to
      calibrated readings, the table adds calibration_gain,
      calibration_gain_se and drift_se_calibration_c_per_year, how far the
      gain's uncertainty moves the drift, which is added in quadrature to
      the quoted error and interval; the noise model's error is then divided
      by the gain, as the noise in a calibrated reading is. Under
      swap_steps at_swaps the fit has a free step at each battery swap and
      the table adds n_battery_swaps, battery_step_dates, battery_steps_c
      and battery_steps_se_c; under fit_method huber the fit is Huber's and
      the table adds n_days_downweighted. Beside them,
      noise_day_step_sd_c and observed_day_step_sd_c: the day-to-day change
      of the daily difference the noise model predicts, and that of the
      residuals, whose ratio is the share of the daily scatter the sensor's
      own noise explains. Offset and temperature-coefficient errors are
      always from the residuals.
    inputs: [fit_input, noise.noise_models#hann_slope_one, battery_swaps]
    decisions: [drift_model, drift_errors, fit_method, swap_steps]
    recipe:
      command: >-
        python src/fit_drift.py {inputs.fit_input} {decisions.drift_model}
        {decisions.drift_errors} {inputs.noise.noise_models#hann_slope_one}
        {decisions.fit_method} {decisions.swap_steps} {inputs.battery_swaps}
        {output}

  reference_check:
    label: Is the reference stable?
    type: metric
    format: json
    description: >-
      On days whose 24 hours are all measured: FRPDAS minus the median of the
      other Freiburg stations, fitted for drift (reference_vs_network); and
      each other station with at least 300 such days minus FRPDAS, fitted the
      same way (stations_vs_reference), summarised by the median, standard
      deviation and 5th–95th percentiles of their drifts and the fraction
      whose 95% interval excludes zero. Those stations are maintained, so
      their apparent drifts are what two sites' different responses to one
      year's weather put into a linear fit. Both drift models, side by side.
    inputs: [reference_daily]
    recipe:
      command: python src/reference_check.py {inputs.reference_daily} FRPDAS {output}

  difference_series:
    label: Daily differences and fitted drifts
    type: figure
    format: png
    description: >-
      One panel per sensor: the daily difference from FRPDAS (used days as
      dots, excluded days as rings), calibrated where the universe
      calibrates, and the fitted drift.
    inputs: [fit_input, drift]
    recipe:
      command: python src/plot_differences.py {inputs.fit_input} {inputs.drift} {output}

  drift_summary:
    label: Drift per sensor
    type: figure
    format: png
    description: >-
      Each sensor's drift with its 95% interval, sorted, over the 5th–95th
      percentile band of the Freiburg stations' apparent drifts against
      FRPDAS under the same model.
    inputs: [drift, reference_check]
    decisions: [drift_model]
    recipe:
      command: >-
        python src/plot_drift.py {inputs.drift} {inputs.reference_check}
        {decisions.drift_model} {output}

  model_comparison:
    label: Drift with and without the temperature term
    type: figure
    format: png
    description: >-
      Each sensor's drift and 95% interval under both drift models, side by
      side: the simple fit, and the same with the temperature term.
    inputs: [drift#simple_fit, drift#temperature_term]
    recipe:
      command: >-
        python src/plot_model_comparison.py {inputs.drift#simple_fit}
        {inputs.drift#temperature_term} {output}

  error_comparison:
    label: Drift error, residuals against noise model
    type: figure
    format: png
    description: >-
      Each sensor's drift standard error from its residuals and from its
      noise model (baseline fit), sorted by their ratio.
    inputs: [drift#baseline]
    recipe:
      command: python src/plot_errors.py {inputs.drift#baseline} {output}

  universe_comparison:
    label: What each alternative changes
    type: metric
    format: json
    description: >-
      For each alternative universe against the baseline: the largest and
      median change in drift over the sensors, the sensor that moves most,
      the largest change in units of the baseline's standard error, the
      median drift, the median ratio of the quoted drift error to the
      baseline's, and how many sensors' 95% intervals exclude zero. The
      alternatives are the baseline's screening, its despiking threshold and
      its errors; what the
      temperature term, the steps and the robust fit change is
      robust_comparison's.
    inputs:
      - drift#baseline
      - drift#gap_filled_reference
      - drift#coverage_90
      - drift#noise_model_errors
      - drift#residual_errors
      - drift#despiking_1c
    recipe:
      command: >-
        python src/compare_universes.py {inputs.drift#baseline}
        gap_filled_reference={inputs.drift#gap_filled_reference}
        coverage_90={inputs.drift#coverage_90}
        noise_model_errors={inputs.drift#noise_model_errors}
        residual_errors={inputs.drift#residual_errors}
        despiking_1c={inputs.drift#despiking_1c} {output}

  calibration_comparison:
    label: What calibrating changes
    type: metric
    format: json
    description: >-
      For each calibrated universe against the simple fit, uncalibrated
      (simple_fit; keys that depend on it name it): how far the drifts move
      (as in universe_comparison), the median drift error the calibration's
      gain adds, and the median ratio of the residuals' scatter to the
      simple fit's. For a gain, also the window, the spread of the sensors'
      gains (median, 5th and 95th percentiles, standard deviation, median
      error) and of the other Freiburg stations' against FRPDAS over the
      same window, how many of each have a 95% interval that excludes 1, and
      the correlation over the sensors of g − 1 from the window with the
      temperature coefficient c fitted over the whole year
      (drift#temperature_term).
    inputs:
      - drift#simple_fit
      - drift#temperature_term
      - drift#offset_two_weeks
      - drift#offset_one_month
      - drift#offset_three_months
      - drift#gain_two_weeks
      - calibration_coefficients#gain_two_weeks
      - drift#gain_one_month
      - calibration_coefficients#gain_one_month
      - drift#gain_three_months
      - calibration_coefficients#gain_three_months
    recipe:
      command: >-
        python src/compare_calibration.py simple_fit={inputs.drift#simple_fit}
        {inputs.drift#temperature_term}
        offset_two_weeks={inputs.drift#offset_two_weeks}
        offset_one_month={inputs.drift#offset_one_month}
        offset_three_months={inputs.drift#offset_three_months}
        gain_two_weeks={inputs.drift#gain_two_weeks},{inputs.calibration_coefficients#gain_two_weeks}
        gain_one_month={inputs.drift#gain_one_month},{inputs.calibration_coefficients#gain_one_month}
        gain_three_months={inputs.drift#gain_three_months},{inputs.calibration_coefficients#gain_three_months}
        {output}

  calibration_gains:
    label: Calibration gain per sensor
    type: figure
    format: png
    description: >-
      Each sensor's gain against FRPDAS with its 95% interval, one panel per
      window, over the 5th–95th percentile band of the other Freiburg
      stations' gains over the same window.
    inputs:
      - calibration_coefficients#gain_two_weeks
      - calibration_coefficients#gain_one_month
      - calibration_coefficients#gain_three_months
    recipe:
      command: >-
        python src/plot_gains.py
        two_weeks={inputs.calibration_coefficients#gain_two_weeks}
        one_month={inputs.calibration_coefficients#gain_one_month}
        three_months={inputs.calibration_coefficients#gain_three_months}
        {output}

  calibration_drift:
    label: Drift with and without a gain calibration
    type: figure
    format: png
    description: >-
      Each sensor's drift and 95% interval uncalibrated (the simple fit) and
      calibrated with a gain and an offset, one panel per window.
    inputs:
      - drift#simple_fit
      - drift#gain_two_weeks
      - drift#gain_one_month
      - drift#gain_three_months
    recipe:
      command: >-
        python src/plot_calibration_drift.py {inputs.drift#simple_fit}
        two_weeks={inputs.drift#gain_two_weeks}
        one_month={inputs.drift#gain_one_month}
        three_months={inputs.drift#gain_three_months}
        {output}

  robust_comparison:
    label: What the temperature term, battery steps and a robust fit change
    type: metric
    format: json
    description: >-
      The battery swaps found; and for each of the temperature term
      (temperature_term), the January gain calibration (gain_one_month),
      Huber's fit (huber_fit), a step at each swap without the gain taken out
      (battery_steps), and the universes with all three (the baseline, with
      the temperature term, and robust_january_gain, with the January gain
      calibration instead), against the simple fit (simple_fit; keys that
      depend on it name it): how far the drifts move (as in
      universe_comparison) and how many days Huber's fit down-weighted. For a
      fit with steps, against its counterpart without steps or Huber's fit:
      the largest change among the sensors without a swap; and for each
      sensor with one, its drift and its counterpart's, the step with its
      error, and the mean residual over the 28 days either side of the swap.
    inputs:
      - battery_swaps
      - drift#simple_fit
      - fit_input#simple_fit
      - drift#temperature_term
      - fit_input#temperature_term
      - drift#gain_one_month
      - fit_input#gain_one_month
      - drift#huber_fit
      - fit_input#huber_fit
      - drift#battery_steps
      - fit_input#battery_steps
      - drift#baseline
      - fit_input#baseline
      - drift#robust_january_gain
      - fit_input#robust_january_gain
    recipe:
      command: >-
        python src/compare_robust.py {inputs.battery_swaps}
        simple_fit={inputs.drift#simple_fit},{inputs.fit_input#simple_fit},-
        temperature_term={inputs.drift#temperature_term},{inputs.fit_input#temperature_term},-
        gain_one_month={inputs.drift#gain_one_month},{inputs.fit_input#gain_one_month},-
        huber_fit={inputs.drift#huber_fit},{inputs.fit_input#huber_fit},-
        battery_steps={inputs.drift#battery_steps},{inputs.fit_input#battery_steps},simple_fit
        baseline={inputs.drift#baseline},{inputs.fit_input#baseline},temperature_term
        robust_january_gain={inputs.drift#robust_january_gain},{inputs.fit_input#robust_january_gain},gain_one_month
        {output}

  swap_residuals:
    label: Residuals around the battery swaps
    type: figure
    format: png
    description: >-
      For each sensor with a battery swap, the residuals of the step fit from
      90 days before the first day on the new battery to 120 after, with
      their 7-day running mean: a step without the gain taken out
      (battery_steps), with the temperature term (the baseline), and with the
      January gain calibration (robust_january_gain).
    inputs:
      - battery_swaps
      - fit_input#battery_steps
      - drift#battery_steps
      - fit_input#baseline
      - drift#baseline
      - fit_input#robust_january_gain
      - drift#robust_january_gain
    recipe:
      command: >-
        python src/plot_swap_residuals.py {inputs.battery_swaps}
        gain_left_in={inputs.fit_input#battery_steps},{inputs.drift#battery_steps}
        temperature_term={inputs.fit_input#baseline},{inputs.drift#baseline}
        January_gain={inputs.fit_input#robust_january_gain},{inputs.drift#robust_january_gain}
        {output}

  robust_drift:
    label: Drift, simple fit and baseline
    type: figure
    format: png
    description: >-
      Each sensor's drift and 95% interval in the simple fit and in the
      baseline (a step at each battery swap, the temperature term, Huber's
      fit), side by side.
    inputs: [drift#simple_fit, drift#baseline]
    recipe:
      command: >-
        python src/plot_model_comparison.py {inputs.drift#simple_fit}
        {inputs.drift#baseline} {output} "simple fit" baseline
        "How battery steps, the temperature term and a robust fit move the drift"

  v1_comparison:
    label: Drift per sensor, v1 and now
    type: table
    format: csv
    description: >-
      Each sensor's drift as this analysis published it in v1 (its baseline,
      the simple fit, read from this repository at v1's commit, as
      analyses.v1) against today's: the same model on today's inputs
      (simple_fit) and today's baseline. Between the first two only the
      inputs changed (sensor-archive and noise-models at their new commits,
      noise-models' slope held at 1); between the last two only the model.
      One row per sensor, sorted by the change in drift: for each fit, the
      drift, its error and its significance (up, down or none, by the 95%
      interval), prefixed v1_, same_model_ and now_; the change in drift
      from v1 to now, in °C per year and in units of v1's error, and the
      ratio of the errors; the same split into the part from the inputs and
      the part from the model; which of the two changed the sensor's
      significance, blank where it ends as it began; and n_battery_swaps
      (src/compare_versions.py).
    inputs: [v1.drift#v1_baseline, drift#simple_fit, drift#baseline]
    recipe:
      command: >-
        python src/compare_versions.py table v1 {inputs.v1.drift#v1_baseline}
        {inputs.drift#simple_fit} {inputs.drift#baseline} {output}

  v1_comparison_summary:
    label: What changed since v1, for the network
    type: metric
    format: json
    description: >-
      From v1_comparison: for v1, the same model today and today's
      baseline, the network's median and mean drift, how many sensors drift
      upward, how many significantly up and down, and the median drift
      error; the median and largest change in drift since v1, the sensor
      that moves most, how many move by more than v1's error, and the
      largest change from the inputs and from the model; the median ratio of
      the errors to v1's, and the range of that ratio from the inputs alone;
      and each sensor whose significance changed, with which of the two
      changed it.
    inputs: [v1_comparison]
    recipe:
      command: python src/compare_versions.py summary v1 {inputs.v1_comparison} {output}

  v1_drift:
    label: Drift, v1 and now
    type: figure
    format: png
    description: >-
      Each sensor's drift and 95% interval as published in v1 (the simple
      fit on v1's inputs) and in today's baseline, side by side.
    inputs: [v1.drift#v1_baseline, drift#baseline]
    recipe:
      command: >-
        python src/plot_model_comparison.py {inputs.v1.drift#v1_baseline}
        {inputs.drift#baseline} {output} "v1 (simple fit)" "now (baseline)"
        "How each sensor's drift moved since v1"

universes:
  baseline:
    label: Baseline
    description: >-
      Readings despiked at 3 °C, measured reference days, sensor-days at
      least 99% covered, drift linear in time beside a temperature-dependent
      bias, a free step at each battery swap, Huber's robust fit, drift
      errors from the residuals and the noise models together, no
      calibration. This was the robust universe until v1, whose baseline was
      the simple fit.
    decisions:
      despike: median3c
      reference_hours: measured
      min_coverage: p99
      drift_model: time_and_temperature
      drift_errors: combined
      swap_steps: at_swaps
      fit_method: huber
      calibrate: none
  gap_filled_reference:
    label: Gap-filled reference days included
    derived_from: baseline
    decisions:
      reference_hours: gap_filled
  coverage_90:
    label: Sensor-days at least 90% covered
    derived_from: baseline
    decisions:
      min_coverage: p90
  noise_model_errors:
    label: Drift errors from the sensors' noise models
    derived_from: baseline
    decisions:
      drift_errors: noise_model
  residual_errors:
    label: Drift errors from the residuals alone
    derived_from: baseline
    decisions:
      drift_errors: residual_ar1
  despiking_1c:
    label: Readings despiked at 1 °C
    description: >-
      The baseline on sensor-archive's summary despiked at 1 °C instead of
      3 °C. Named apart from the archive's universe despiked_1c, which the
      switch sensor_summary pins.
    derived_from: baseline
    decisions:
      despike: median1c
  robust_january_gain:
    label: The baseline with the January gain calibration instead
    description: >-
      The baseline with each sensor's gain taken out by calibrating it over
      January instead of by the temperature term: a gain fitted on days
      before every swap, so it cannot trade off against the steps.
    derived_from: baseline
    decisions:
      drift_model: time_only
      calibrate: initial_window
      calibration.window: one_month
      calibration.model: gain_and_offset
  simple_fit:
    label: Simple fit
    description: >-
      A line in time by least squares, with no allowance for battery swaps:
      the baseline until v1. Each universe derived from it adds one thing:
      the temperature term, a step at each swap, Huber's fit, or a
      calibration.
    derived_from: baseline
    decisions:
      drift_model: time_only
      swap_steps: none
      fit_method: least_squares
  temperature_term:
    label: Simple fit with a temperature-dependent bias
    derived_from: simple_fit
    decisions:
      drift_model: time_and_temperature
  battery_steps:
    label: Simple fit with a step at each battery swap
    description: >-
      Built to show what a step does without the gain taken out; the
      baseline fits the step with the temperature term.
    derived_from: simple_fit
    decisions:
      swap_steps: at_swaps
  huber_fit:
    label: Simple fit by Huber's M-estimate
    derived_from: simple_fit
    decisions:
      fit_method: huber
  offset_two_weeks:
    label: Calibrated over two weeks, offset only
    derived_from: simple_fit
    decisions:
      calibrate: initial_window
      calibration.window: two_weeks
      calibration.model: offset_only
  offset_one_month:
    label: Calibrated over one month, offset only
    derived_from: simple_fit
    decisions:
      calibrate: initial_window
      calibration.window: one_month
      calibration.model: offset_only
  offset_three_months:
    label: Calibrated over three months, offset only
    derived_from: simple_fit
    decisions:
      calibrate: initial_window
      calibration.window: three_months
      calibration.model: offset_only
  gain_two_weeks:
    label: Calibrated over two weeks, gain and offset
    derived_from: simple_fit
    decisions:
      calibrate: initial_window
      calibration.window: two_weeks
      calibration.model: gain_and_offset
  gain_one_month:
    label: Calibrated over one month, gain and offset
    derived_from: simple_fit
    decisions:
      calibrate: initial_window
      calibration.window: one_month
      calibration.model: gain_and_offset
  gain_three_months:
    label: Calibrated over three months, gain and offset
    derived_from: simple_fit
    decisions:
      calibrate: initial_window
      calibration.window: three_months
      calibration.model: gain_and_offset
  v1_baseline:
    label: v1's baseline
    description: >-
      Imported from this analysis as published in v1 (analyses.v1): its
      baseline, the simple fit on v1's inputs, to compare today's results
      with.
    analysis: v1
    universe: baseline

findings:
  sensors_drift_upward:
    claim: >-
      Against FRPDAS, the sensors drifted upward over 2023 as a group: in the
      baseline, with a temperature-dependent bias, a step at each battery
      swap and Huber's fit, their median drift is +0.32 °C per year, and 22
      of the 40 sensors have a 95% interval that excludes zero, with the
      residuals' and the noise models' errors added.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3193' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 22' }

  reference_stable:
    claim: >-
      FRPDAS shows no significant drift against the median of Freiburg's
      other stations over 2023: +0.11 °C per year, 95% interval −0.09 to
      +0.31, or +0.15, −0.04 to +0.35, with the temperature term the
      baseline fits. The sensors' drifts are not the reference's.
    evidence:
      - artifact: reference_check
        quote: { exact: '"drift_c_per_year": 0.1058' }
      - artifact: reference_check
        quote: { exact: '"drift_ci95_low_c_per_year": -0.0943' }
      - artifact: reference_check
        quote: { exact: '"drift_c_per_year": 0.1509' }
      - artifact: reference_check
        quote: { exact: '"drift_ci95_low_c_per_year": -0.0431' }

  siting_floor:
    claim: >-
      Maintained Freiburg stations show apparent drifts against FRPDAS over
      2023 from −0.36 to +0.54 °C per year (5th–95th percentile) under the
      baseline's drift model, with the temperature term, and from −0.43 to
      +0.43 with a line in time alone, from their sites alone. A sensor's
      drift inside that range cannot be told apart from where it stands,
      unless it is co-located with FRPDAS.
    evidence:
      - artifact: reference_check
        quote: { exact: '"drift_p05_c_per_year": -0.3607' }
      - artifact: reference_check
        quote: { exact: '"drift_p95_c_per_year": 0.5374' }
      - artifact: reference_check
        quote: { exact: '"drift_p05_c_per_year": -0.4279' }
      - artifact: reference_check
        quote: { exact: '"drift_p95_c_per_year": 0.4347' }

  temperature_term_matters:
    claim: >-
      Added to the simple fit, a temperature-dependent bias moves the
      sensors' drifts by a median of 0.11 °C per year and by up to 0.37 °C
      per year (s22), and lowers the median drift from +0.42 to +0.34 °C per
      year: for the sensors whose difference follows the seasons, how drift
      is separated from a temperature dependence matters about as much as
      the drift's uncertainty, up to 1.1 of its standard error.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1099' }
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.3706' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.4159' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_in_simple_fit_se": 1.136' }

  screening_choices_immaterial:
    claim: >-
      Counting FRPDAS's gap-filled days, or lowering the sensor-day coverage
      threshold to 90%, changes no sensor's drift in the baseline by more
      than 0.02 °C per year, at most 0.13 of its standard error. Either
      choice can be made.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0165' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.01,' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 0.127' }

  both_error_sources_matter:
    claim: >-
      Neither the residuals nor the sensors' noise models alone account for
      the drift's uncertainty, though in the baseline the noise models carry
      most of it. Taken alone, the residuals' errors are a median 0.28 of
      the combined ones and the noise models' 0.96: with the seasons and the
      steps fitted, the residuals are small and short-lived, and the
      sensors' slow 1/f wander, which they cannot show, sets the error. With
      either alone more sensors' drifts would pass for significant: 37 or 25
      of 40, against 22 with both.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 0.277' }
      - artifact: universe_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 0.961' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 37' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 25' }

  offset_calibration_changes_nothing:
    claim: >-
      Calibrating each sensor's offset alone, over any of the three windows,
      changes no sensor's drift: a drift fitted with an offset of its own
      cannot see a constant correction.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0,' }

  sensors_have_gains:
    claim: >-
      Many sensors follow the reference's temperature with a gain other than
      1: calibrated over January, 20 of the 40 have a gain whose 95%
      interval excludes 1, and their gains run from 0.96 to 1.05 (5th–95th
      percentile). The gain is not an accident of the window: over the
      sensors it correlates at 0.91 with the temperature coefficient fitted
      to the whole year, and calibrating it out shrinks the median sensor's
      residual scatter over the year by a sixth.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_gain_ci95_excluding_one": 20' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_p05": 0.9629' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_p95": 1.054' }
      - artifact: calibration_comparison
        quote: { exact: '"gain_vs_temperature_coefficient_corr": 0.906' }
      - artifact: calibration_comparison
        quote: { exact: '"median_residual_sd_ratio_to_simple_fit": 0.839' }

  gains_not_only_the_sensors:
    claim: >-
      Part of a sensor's gain against FRPDAS is its site. Calibrated against
      FRPDAS over January, Freiburg's other, maintained stations show gains
      as widely spread as the sensors' (standard deviation 0.031 against
      0.030). Over three months the stations' spread narrows to 0.020 while
      the sensors' stays at 0.027, and 20 of the 40 sensors' gains differ
      from 1 against 5 of the 39 stations': some sensors have a gain beyond
      what siting gives.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"station_gain_sd": 0.0311' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_sd": 0.0296' }
      - artifact: calibration_comparison
        quote: { exact: '"station_gain_sd": 0.0195' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_sd": 0.0272' }
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_gain_ci95_excluding_one": 20' }
      - artifact: calibration_comparison
        quote: { exact: '"n_stations_gain_ci95_excluding_one": 5' }

  gain_calibration_moves_drift:
    claim: >-
      Calibrating a gain and an offset over January, before the simple fit,
      moves the sensors' drifts by a median of 0.13 °C per year and by up to
      0.43 °C per year (s23), 1.5 of the simple fit's standard error, and
      lowers the median drift from +0.42 to +0.35 °C per year, close to the
      temperature term's +0.34: a gain from January takes out much of the
      seasonal pattern the whole year's temperature term does. With it, 23
      of the 40 sensors drift significantly, against 22 without.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1345' }
      - artifact: calibration_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.4282' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_of_max": "s23"' }
      - artifact: calibration_comparison
        quote: { exact: '"max_abs_drift_change_in_simple_fit_se": 1.506' }
      - artifact: calibration_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3472' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 23' }
      - artifact: calibration_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 22' }

  calibration_window:
    claim: >-
      Two weeks is too short to calibrate a gain, and a month is enough. The
      sensors' gains are known to a median standard error of 0.024 from two
      weeks, 0.010 from a month and 0.009 from three; carried into the
      drift, the two-week gain's uncertainty adds a median 0.15 °C per year
      to its error and widens it by a fifth, the month's 0.07. Three months
      move the drifts much as one does, by a median of 0.13 °C per year.
    evidence:
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_median_se": 0.0244' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_median_se": 0.0104' }
      - artifact: calibration_comparison
        quote: { exact: '"sensor_gain_median_se": 0.0085' }
      - artifact: calibration_comparison
        quote: { exact: '"median_drift_se_calibration_c_per_year": 0.1485' }
      - artifact: calibration_comparison
        quote: { exact: '"median_se_ratio_to_simple_fit": 1.214' }
      - artifact: calibration_comparison
        quote: { exact: '"median_drift_se_calibration_c_per_year": 0.0656' }
      - artifact: calibration_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1267' }

  battery_swaps_found:
    claim: >-
      The archive's battery voltage shows three battery swaps in 2023: s02
      on 2 March, s20 on 9 June and s34 on 14 September, each in the course
      of the day. They are where those sensors' differences from FRPDAS
      step.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"n_swaps": 3' }
      - artifact: robust_comparison
        quote: { exact: '"dates": "s02:2023-03-02;s20:2023-06-09;s34:2023-09-14"' }

  settling_is_the_gain:
    claim: >-
      Fitted with a step at each battery swap but the gain left in, s02's
      and s34's residuals stay off zero for weeks after their swaps, a jump
      that seems to settle: over the 28 days from the swap they average
      −0.17 and +0.39 °C. That is not the swap but each sensor's gain
      following the spring's warming and the autumn's cooling, which a step
      cannot follow. With the gain taken out by the temperature term, as in
      the baseline, the residuals of every swapped sensor average within
      0.05 °C of zero over the 28 days either side of its swap, and the
      steps of s02 and s34 come out twice as large or more, −0.63 and +0.81
      °C against −0.31 and +0.24. A step is enough; no settling needs
      modelling.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"s02_residual_after_swap_c": -0.174' }
      - artifact: robust_comparison
        quote: { exact: '"s34_residual_after_swap_c": 0.39' }
      - artifact: robust_comparison
        quote: { exact: '"s02_residual_after_swap_c": 0.025' }
      - artifact: robust_comparison
        quote: { exact: '"s20_residual_after_swap_c": 0.043' }
      - artifact: robust_comparison
        quote: { exact: '"s34_residual_after_swap_c": 0.041' }
      - artifact: robust_comparison
        quote: { exact: '"s02_steps_c": "-0.6347"' }
      - artifact: robust_comparison
        quote: { exact: '"s34_steps_c": "0.8054"' }
      - artifact: robust_comparison
        quote: { exact: '"s02_steps_c": "-0.3063"' }
      - artifact: robust_comparison
        quote: { exact: '"s34_steps_c": "0.2428"' }

  battery_steps_matter:
    claim: >-
      With the gain taken out by the temperature term, a step at each swap
      changes the drifts of the three swapped sensors and of hardly any
      other, by at most 0.026 °C per year with Huber's fit. s20's falls from
      +1.57 to +0.45 °C per year, its swap having stepped it by +0.80 °C:
      the largest drift in the network was mostly a battery swap. s34's
      turns from +0.70 to −0.42 °C per year: it drifted down, and its swap
      stepped it up by more. s02's goes from −0.74 to −0.27 °C per year.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"s20_counterpart_drift_c_per_year": 1.5664' }
      - artifact: robust_comparison
        quote: { exact: '"s20_drift_c_per_year": 0.4498' }
      - artifact: robust_comparison
        quote: { exact: '"s20_steps_c": "0.8032"' }
      - artifact: robust_comparison
        quote: { exact: '"s34_counterpart_drift_c_per_year": 0.6961' }
      - artifact: robust_comparison
        quote: { exact: '"s34_drift_c_per_year": -0.4204' }
      - artifact: robust_comparison
        quote: { exact: '"s02_counterpart_drift_c_per_year": -0.7415' }
      - artifact: robust_comparison
        quote: { exact: '"s02_drift_c_per_year": -0.2663' }
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_unstepped_vs_counterpart_c_per_year": 0.0256' }

  outliers_immaterial:
    claim: >-
      Outlying days do not drive the drifts. Added to the simple fit,
      Huber's robust fit moves no sensor's drift by more than 0.044 °C per
      year, 0.25 of its standard error, and down-weights 14.5% of the days
      fitted, fewer than the 18% it would for Gaussian residuals; in the
      baseline it down-weights 17.9%. After the screening, the residuals
      have no heavy tail.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0444' }
      - artifact: robust_comparison
        quote: { exact: '"max_abs_drift_change_in_simple_fit_se": 0.251' }
      - artifact: robust_comparison
        quote: { exact: '"share_days_downweighted": 0.145' }
      - artifact: robust_comparison
        quote: { exact: '"share_days_downweighted": 0.179' }

  robust_agrees:
    claim: >-
      The baseline, with a step at each battery swap, the temperature term
      and Huber's fit, finds the sensors drifting upward as a group as the
      simple fit does: a median of +0.32 °C per year, against the simple
      fit's +0.42 and the temperature term's +0.34 alone, and 22 of the 40
      sensors significantly, as many as in the simple fit. Taking the gain
      out by the January calibration instead gives the same median, +0.32,
      with 21 significant.
    evidence:
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3193' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.4159' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: robust_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 22' }
      - artifact: robust_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3223' }
      - artifact: robust_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 21' }

  changes_since_v1:
    claim: >-
      Since v1, the drifts moved only with the new baseline, and the new
      inputs moved only their errors: v1's model on today's inputs changes
      no sensor's drift, and its error by ×0.72 to ×1.26, from noise-models'
      slope held at 1. The new baseline moves the drifts by a median of 0.14
      °C per year and by up to 1.30 (s20, at its battery swap), and the
      network's median drift from +0.42 to +0.32 °C per year. Seven sensors
      changed significance: s11 and s12 lost it with the new noise models;
      with the new baseline s20 and s27 lost it, s22 and s28 gained it, and
      s34 turned from up to down. 17 sensors drift significantly up and 5
      down, against 20 and 4 in v1.
    evidence:
      - artifact: v1_comparison_summary
        quote: { exact: '"max_abs_drift_change_from_inputs_c_per_year": 0.0,' }
      - artifact: v1_comparison_summary
        quote: { exact: '"min_se_ratio_from_inputs": 0.724' }
      - artifact: v1_comparison_summary
        quote: { exact: '"max_se_ratio_from_inputs": 1.258' }
      - artifact: v1_comparison_summary
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1422' }
      - artifact: v1_comparison_summary
        quote: { exact: '"max_abs_drift_change_c_per_year": 1.2973' }
      - artifact: v1_comparison_summary
        quote: { exact: '"sensor_of_max": "s20"' }
      - artifact: v1_comparison_summary
        quote: { exact: '"v1_median_drift_c_per_year": 0.4159' }
      - artifact: v1_comparison_summary
        quote: { exact: '"now_median_drift_c_per_year": 0.3193' }
      - artifact: v1_comparison_summary
        quote: { exact: '"n_sensors_significance_changed": 7' }
      - artifact: v1_comparison_summary
        quote: { exact: '"s11": "up to none, by the inputs"' }
      - artifact: v1_comparison_summary
        quote: { exact: '"s12": "up to none, by the inputs"' }
      - artifact: v1_comparison_summary
        quote: { exact: '"s34": "up to down, by the model"' }
      - artifact: v1_comparison_summary
        quote: { exact: '"now_n_significantly_up": 17' }
      - artifact: v1_comparison_summary
        quote: { exact: '"now_n_significantly_down": 5' }
      - artifact: v1_comparison_summary
        quote: { exact: '"v1_n_significantly_up": 20' }
      - artifact: v1_comparison_summary
        quote: { exact: '"v1_n_significantly_down": 4' }
