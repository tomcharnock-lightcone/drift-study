# ASTRA Analysis Specification

spec_version: "0.1.0"
label: "drift-study"
description: >-
  How far each of the city's 40 low-cost temperature sensors (s01 to s40)
  drifted over 2023. Each sensor's despiked daily mean, from sensor-archive,
  is compared with the daily mean air temperature of FRPDAS, a station of
  Freiburg's street-level weather network (Plein, Christen & Dormann,
  doi:10.5281/zenodo.21307957), and a linear drift is fitted per sensor to the
  daily difference. The station file is streamed from Zenodo and checked
  against its published MD5; only the daily means it gives are kept. Whether
  FRPDAS itself is stable, and how much apparent drift two maintained stations
  show against each other over one year, is checked against the rest of the
  Freiburg network. Whether calibrating each sensor against FRPDAS over an
  initial window, with an offset or a gain and an offset, changes the drift
  is checked with the calibration analysis in calibration/.

analyses:
  archive:
    url: https://github.com/tomcharnock-lightcone/sensor-archive
    commit: aaeeaae5fbb0e15e3a1954ed831f01542916f145
  noise:
    url: https://github.com/tomcharnock-lightcone/noise-models
    commit: 6402027ef2b830d6caab22e9a1f03811d0c1871a
  calibration:
    path: calibration

decisions:
  reference_hours:
    label: Reference hours
    rationale: >-
      The Freiburg file is gap-filled: an hour the station did not record is
      replaced by a model prediction and marked `type = predicted`. In 2023,
      13 of FRPDAS's 365 days hold at least one predicted hour, one of them
      all 24. A predicted hour is a model of the station, not a measurement,
      so comparing a sensor with it can pass the model's error to the sensor;
      leaving those days out costs 13 days a sensor.
    options:
      measured:
        label: Measured days only
        description: >-
          Only days whose 24 hourly values at FRPDAS are all measured.
      gap_filled:
        label: Gap-filled days too
        description: >-
          Every day, with the gap-filled hours as published.

  min_coverage:
    label: Sensor-day coverage
    rationale: >-
      A sensor-day missing part of its readings has a mean biased by
      whichever part of the daily cycle is missing, while the reference's
      mean covers the whole day; partial days in the 2023 summaries depart
      from their sensor's usual difference by up to several °C. A day counts
      as covered by the share of its 8640 ten-second readings delivered,
      readings despiking removed included (they are isolated single readings
      and leave no hole). Fewer than 1% of sensor-days fall below 99%, so the
      threshold mostly decides a few dozen days.
    options:
      p99:
        label: At least 99% of the day
      p90:
        label: At least 90% of the day
      any:
        label: Every day with readings
        excluded: >-
          Days with a small fraction of their readings give means several °C
          away from the day's true mean; they would enter the fit as outliers
          of known cause.

  drift_model:
    label: Drift model
    rationale: >-
      A drift is a change in a sensor's difference from the reference over
      time. But a sensor whose bias depends on temperature (a gain error, or
      radiative heating that grows on warm, sunny days) shows a seasonal cycle
      in its difference that is not drift; 2023 is not symmetric about
      mid-year, so part of that cycle projects onto a linear trend. Adding the
      reference temperature as a regressor separates the two, at the cost of
      a model that assumes the temperature dependence is linear and constant
      over the year.
    options:
      time_only:
        label: Linear in time
        description: >-
          d = a + b·t: the linear drift asked for, nothing else.
      time_and_temperature:
        label: Linear in time and in reference temperature
        description: >-
          d = a + b·t + c·(T_ref − T̄_ref): a linear drift plus a bias
          proportional to the reference temperature.

  drift_errors:
    label: Drift uncertainty
    rationale: >-
      Two things scatter a sensor's daily difference from the reference: the
      sensor's own noise, which noise-models measured in a climate chamber
      (white plus 1/f), and the two sites answering the weather differently,
      plus the reference's own noise. The residuals of the fit hold both,
      but an AR(1) model of them has short memory and misses how 1/f noise
      keeps wandering over months. The noise model has that memory but knows
      nothing of the sites, and reaches a year only by extending a week-long
      chamber run, at about 20 °C, three decades below its lowest fitted
      frequency. Neither is complete, so the baseline adds the two; each
      alone is built for comparison.
    options:
      residual_ar1:
        label: From the residuals
        description: >-
          Least-squares error scaled by the AR(1) effective sample size of
          the residuals (Santer et al. 2000); Student-t interval.
      noise_model:
        label: From the sensor's noise model
        description: >-
          The variance of the fitted drift under the sensor's chamber noise
          model (noise-models, Hann window), propagated through the daily
          means and the fit's weights; Gaussian interval. Instrument noise
          only.
      combined:
        label: Both added
        description: >-
          The two variances added, and the interval half-widths in
          quadrature. The instrument's day-to-day noise is counted in both,
          so this errs wide.

  calibrate:
    label: Calibration before the fit
    rationale: >-
      A drift is what changes in a sensor after it was set up. Calibrating
      each sensor against the reference over the start of its record
      removes what it read wrong from the start, so that the fit sees only
      what came later. An offset cannot change a drift fitted with an
      offset of its own; a gain can, by taking the seasonal cycle it causes
      out of the difference. The calibration's window and model are the
      calibration analysis's decisions, selected where this one is
      initial_window.
    options:
      none:
        label: None
        description: The sensors' daily means as the archive gives them.
      initial_window:
        label: Over an initial window
        description: >-
          Each sensor's daily means calibrated against FRPDAS over the start
          of its record (calibration analysis), with the gain's uncertainty
          carried into the drift's.

outputs:
  reference_daily:
    label: Freiburg stations' daily means, 2023
    type: table
    format: csv
    description: >-
      Daily mean air temperature (ta) of every station of the Freiburg
      street-level network for each UTC day of 2023, from the hourly file
      ta_vp_rh_60_min_2022_09_01_2024_08_31_gap_filled.csv of
      doi:10.5281/zenodo.21307957 (CC BY 4.0). The file is streamed whole and
      checked against its published MD5 (093ef1695526841b2ea5e66d800ca42e),
      and is not kept. Columns: date, station, ta_mean_c (mean of the day's
      hourly values, measured and gap-filled alike), n_hours, n_measured.
      Hourly timestamps are UTC and are assigned to the day they fall in.
    recipe:
      command: >-
        python src/reference_daily.py
        https://zenodo.org/api/records/21307957/files/ta_vp_rh_60_min_2022_09_01_2024_08_31_gap_filled.csv/content
        093ef1695526841b2ea5e66d800ca42e 2023 {output}

  differences:
    label: Sensor minus reference, per day
    type: table
    format: csv
    description: >-
      One row per sensor-day of the archive's despiked daily summary: date,
      sensor, sensor_mean_c, reference_mean_c (FRPDAS), difference_c,
      coverage (share of the day's 8640 readings delivered),
      reference_measured_hours, used, and excluded_reason for a day not used,
      by precedence: flatline (every reading the same value, a stuck sensor),
      flatline_adjacent (the day before or after one, which the summary
      cannot tell how much of was stuck), low_coverage, no_reference,
      reference_gap_filled.
    inputs: [archive.daily_summary#despiked, reference_daily]
    decisions: [reference_hours, min_coverage]
    recipe:
      command: >-
        python src/differences.py {inputs.archive.daily_summary#despiked}
        {inputs.reference_daily} FRPDAS {decisions.reference_hours}
        {decisions.min_coverage} {output}

  fit_input:
    switch: calibrate
    cases:
      none: differences
      initial_window: calibration.calibrated

  calibration_coefficients:
    switch: calibrate
    cases:
      initial_window: calibration.coefficients

  drift:
    label: Linear drift per sensor
    type: table
    format: csv
    description: >-
      One row per sensor, fitted by least squares to its used days:
      drift_c_per_year (b, per 365.25 days) with drift_se_c_per_year and its
      95% interval (drift_ci95_low/high_c_per_year); offset_c (a, the
      difference at 2023-07-02) with offset_se_c; temp_coef_c_per_c and its
      error (c, under the temperature model only); residual_sd_c,
      residual_lag1_autocorr and n_effective; drift_ols_se_c_per_year, the
      unadjusted error, for comparison; n_days_used and the days excluded
      for each reason. The drift's error is given both ways in every table:
      drift_se_residual_c_per_year, for autocorrelated residuals by the
      effective sample size of an AR(1) process, n_e = n(1 − r₁)/(1 + r₁)
      (Santer et al. 2000, doi:10.1029/1999JD901105), with Student-t
      intervals on n_e − k degrees of freedom (Newey–West errors were tried
      and rejected: on simulated AR(1) residuals as persistent as these,
      their 95% intervals covered the true trend 80–90% of the time,
      tests/test_drift_stats.py); and drift_se_noise_model_c_per_year, from
      the sensor's noise model (src/noise_propagation.py). drift_errors picks
      which the quoted drift_se_c_per_year and interval use. Fitted to
      calibrated readings, the table adds calibration_gain,
      calibration_gain_se and drift_se_calibration_c_per_year, how far the
      gain's uncertainty moves the drift, which is added in quadrature to
      the quoted error and interval; the noise model's error is then divided
      by the gain, as the noise in a calibrated reading is. Beside them,
      noise_day_step_sd_c and observed_day_step_sd_c: the day-to-day change
      of the daily difference the noise model predicts, and that of the
      residuals, whose ratio is the share of the daily scatter the sensor's
      own noise explains. Offset and temperature-coefficient errors are
      always from the residuals.
    inputs: [fit_input, noise.noise_models#hann]
    decisions: [drift_model, drift_errors]
    recipe:
      command: >-
        python src/fit_drift.py {inputs.fit_input} {decisions.drift_model}
        {decisions.drift_errors} {inputs.noise.noise_models#hann} {output}

  reference_check:
    label: Is the reference stable?
    type: metric
    format: json
    description: >-
      On days whose 24 hours are all measured: FRPDAS minus the median of the
      other Freiburg stations, fitted for drift (reference_vs_network); and
      each other station with at least 300 such days minus FRPDAS, fitted the
      same way (stations_vs_reference), summarised by the median, standard
      deviation and 5th–95th percentiles of their drifts and the fraction
      whose 95% interval excludes zero. Those stations are maintained, so
      their apparent drifts are what two sites' different responses to one
      year's weather put into a linear fit. Both drift models, side by side.
    inputs: [reference_daily]
    recipe:
      command: python src/reference_check.py {inputs.reference_daily} FRPDAS {output}

  difference_series:
    label: Daily differences and fitted drifts
    type: figure
    format: png
    description: >-
      One panel per sensor: the daily difference from FRPDAS (used days as
      dots, excluded days as rings), calibrated where the universe
      calibrates, and the fitted drift.
    inputs: [fit_input, drift]
    recipe:
      command: python src/plot_differences.py {inputs.fit_input} {inputs.drift} {output}

  drift_summary:
    label: Drift per sensor
    type: figure
    format: png
    description: >-
      Each sensor's drift with its 95% interval, sorted, over the 5th–95th
      percentile band of the Freiburg stations' apparent drifts against
      FRPDAS under the same model.
    inputs: [drift, reference_check]
    decisions: [drift_model]
    recipe:
      command: >-
        python src/plot_drift.py {inputs.drift} {inputs.reference_check}
        {decisions.drift_model} {output}

  model_comparison:
    label: Drift with and without the temperature term
    type: figure
    format: png
    description: >-
      Each sensor's drift and 95% interval under both drift models, side by
      side.
    inputs: [drift#baseline, drift#temperature_term]
    recipe:
      command: >-
        python src/plot_model_comparison.py {inputs.drift#baseline}
        {inputs.drift#temperature_term} {output}

  error_comparison:
    label: Drift error, residuals against noise model
    type: figure
    format: png
    description: >-
      Each sensor's drift standard error from its residuals and from its
      noise model (baseline fit), sorted by their ratio.
    inputs: [drift#baseline]
    recipe:
      command: python src/plot_errors.py {inputs.drift#baseline} {output}

  universe_comparison:
    label: What each alternative changes
    type: metric
    format: json
    description: >-
      For each alternative universe against the baseline: the largest and
      median change in drift over the sensors, the sensor that moves most,
      the largest change in units of the baseline's standard error, the
      median drift, the median ratio of the quoted drift error to the
      baseline's, and how many sensors' 95% intervals exclude zero.
    inputs:
      - drift#baseline
      - drift#temperature_term
      - drift#gap_filled_reference
      - drift#coverage_90
      - drift#noise_model_errors
      - drift#residual_errors
    recipe:
      command: >-
        python src/compare_universes.py {inputs.drift#baseline}
        temperature_term={inputs.drift#temperature_term}
        gap_filled_reference={inputs.drift#gap_filled_reference}
        coverage_90={inputs.drift#coverage_90}
        noise_model_errors={inputs.drift#noise_model_errors}
        residual_errors={inputs.drift#residual_errors} {output}

  calibration_comparison:
    label: What calibrating changes
    type: metric
    format: json
    description: >-
      For each calibrated universe against the baseline: how far the drifts
      move (as in universe_comparison), the median drift error the
      calibration's gain adds, and the median ratio of the residuals'
      scatter to the baseline's. For a gain, also the window, the spread of
      the sensors' gains (median, 5th and 95th percentiles, standard
      deviation, median error) and of the other Freiburg stations' against
      FRPDAS over the same window, how many of each have a 95% interval
      that excludes 1, and the correlation over the sensors of g − 1 from
      the window with the temperature coefficient c fitted over the whole
      year (drift#temperature_term).
    inputs:
      - drift#baseline
      - drift#temperature_term
      - drift#offset_two_weeks
      - drift#offset_one_month
      - drift#offset_three_months
      - drift#gain_two_weeks
      - calibration_coefficients#gain_two_weeks
      - drift#gain_one_month
      - calibration_coefficients#gain_one_month
      - drift#gain_three_months
      - calibration_coefficients#gain_three_months
    recipe:
      command: >-
        python src/compare_calibration.py {inputs.drift#baseline}
        {inputs.drift#temperature_term}
        offset_two_weeks={inputs.drift#offset_two_weeks}
        offset_one_month={inputs.drift#offset_one_month}
        offset_three_months={inputs.drift#offset_three_months}
        gain_two_weeks={inputs.drift#gain_two_weeks},{inputs.calibration_coefficients#gain_two_weeks}
        gain_one_month={inputs.drift#gain_one_month},{inputs.calibration_coefficients#gain_one_month}
        gain_three_months={inputs.drift#gain_three_months},{inputs.calibration_coefficients#gain_three_months}
        {output}

  calibration_gains:
    label: Calibration gain per sensor
    type: figure
    format: png
    description: >-
      Each sensor's gain against FRPDAS with its 95% interval, one panel per
      window, over the 5th–95th percentile band of the other Freiburg
      stations' gains over the same window.
    inputs:
      - calibration_coefficients#gain_two_weeks
      - calibration_coefficients#gain_one_month
      - calibration_coefficients#gain_three_months
    recipe:
      command: >-
        python src/plot_gains.py
        two_weeks={inputs.calibration_coefficients#gain_two_weeks}
        one_month={inputs.calibration_coefficients#gain_one_month}
        three_months={inputs.calibration_coefficients#gain_three_months}
        {output}

  calibration_drift:
    label: Drift with and without a gain calibration
    type: figure
    format: png
    description: >-
      Each sensor's drift and 95% interval uncalibrated (baseline) and
      calibrated with a gain and an offset, one panel per window.
    inputs:
      - drift#baseline
      - drift#gain_two_weeks
      - drift#gain_one_month
      - drift#gain_three_months
    recipe:
      command: >-
        python src/plot_calibration_drift.py {inputs.drift#baseline}
        two_weeks={inputs.drift#gain_two_weeks}
        one_month={inputs.drift#gain_one_month}
        three_months={inputs.drift#gain_three_months}
        {output}

universes:
  baseline:
    label: Baseline
    description: >-
      Measured reference days, sensor-days at least 99% covered, drift linear
      in time, drift errors from the residuals and the noise models together,
      no calibration.
    decisions:
      reference_hours: measured
      min_coverage: p99
      drift_model: time_only
      drift_errors: combined
      calibrate: none
  temperature_term:
    label: With a temperature-dependent bias
    derived_from: baseline
    decisions:
      drift_model: time_and_temperature
  gap_filled_reference:
    label: Gap-filled reference days included
    derived_from: baseline
    decisions:
      reference_hours: gap_filled
  coverage_90:
    label: Sensor-days at least 90% covered
    derived_from: baseline
    decisions:
      min_coverage: p90
  noise_model_errors:
    label: Drift errors from the sensors' noise models
    derived_from: baseline
    decisions:
      drift_errors: noise_model
  residual_errors:
    label: Drift errors from the residuals alone
    derived_from: baseline
    decisions:
      drift_errors: residual_ar1
  offset_two_weeks:
    label: Calibrated over two weeks, offset only
    derived_from: baseline
    decisions:
      calibrate: initial_window
      calibration.window: two_weeks
      calibration.model: offset_only
  offset_one_month:
    label: Calibrated over one month, offset only
    derived_from: baseline
    decisions:
      calibrate: initial_window
      calibration.window: one_month
      calibration.model: offset_only
  offset_three_months:
    label: Calibrated over three months, offset only
    derived_from: baseline
    decisions:
      calibrate: initial_window
      calibration.window: three_months
      calibration.model: offset_only
  gain_two_weeks:
    label: Calibrated over two weeks, gain and offset
    derived_from: baseline
    decisions:
      calibrate: initial_window
      calibration.window: two_weeks
      calibration.model: gain_and_offset
  gain_one_month:
    label: Calibrated over one month, gain and offset
    derived_from: baseline
    decisions:
      calibrate: initial_window
      calibration.window: one_month
      calibration.model: gain_and_offset
  gain_three_months:
    label: Calibrated over three months, gain and offset
    derived_from: baseline
    decisions:
      calibrate: initial_window
      calibration.window: three_months
      calibration.model: gain_and_offset

findings:
  sensors_drift_upward:
    claim: >-
      Against FRPDAS, the sensors drifted upward over 2023 as a group: their
      median drift is +0.42 °C per year (drift linear in time), and 24 of the
      40 sensors have a 95% interval that excludes zero, with the residuals'
      and the noise models' errors added.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_drift_c_per_year": 0.4159' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 24' }

  reference_stable:
    claim: >-
      FRPDAS shows no significant drift against the median of Freiburg's
      other stations over 2023: +0.11 °C per year, 95% interval −0.09 to
      +0.31. The sensors' drifts are not the reference's.
    evidence:
      - artifact: reference_check
        quote: { exact: '"drift_c_per_year": 0.1058' }
      - artifact: reference_check
        quote: { exact: '"drift_ci95_low_c_per_year": -0.0943' }

  siting_floor:
    claim: >-
      Maintained Freiburg stations show apparent linear drifts against FRPDAS
      over 2023 from −0.43 to +0.43 °C per year (5th–95th percentile), from
      their sites alone. A sensor's drift inside that range cannot be told
      apart from where it stands, unless it is co-located with FRPDAS.
    evidence:
      - artifact: reference_check
        quote: { exact: '"drift_p05_c_per_year": -0.4279' }
      - artifact: reference_check
        quote: { exact: '"drift_p95_c_per_year": 0.4347' }

  temperature_term_matters:
    claim: >-
      Allowing a temperature-dependent bias moves the sensors' drifts by a
      median of 0.11 °C per year and by up to 0.37 °C per year (s22), and
      lowers the median drift to +0.34 °C per year: for the sensors whose
      difference follows the seasons, how drift is separated from a
      temperature dependence matters about as much as the drift's
      uncertainty, up to 1.1 of its standard error.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_abs_drift_change_c_per_year": 0.1099' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.3706' }
      - artifact: universe_comparison
        quote: { exact: '"median_drift_c_per_year": 0.3357' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 1.116' }

  screening_choices_immaterial:
    claim: >-
      Counting FRPDAS's gap-filled days, or lowering the sensor-day coverage
      threshold to 90%, changes no sensor's drift by more than 0.02 °C per
      year, at most a tenth of its standard error. Either choice can be
      made.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0196' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_c_per_year": 0.0121' }
      - artifact: universe_comparison
        quote: { exact: '"max_abs_drift_change_in_baseline_se": 0.104' }

  both_error_sources_matter:
    claim: >-
      Neither the residuals nor the sensors' noise models alone account for
      the drift's uncertainty. Taken alone, the residual errors are a median
      0.55 of the combined ones and the noise-model errors 0.83, and with
      either alone more sensors' drifts would pass for significant: 34 or 30
      of 40, against 24 with both.
    evidence:
      - artifact: universe_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 0.553' }
      - artifact: universe_comparison
        quote: { exact: '"median_se_ratio_to_baseline": 0.833' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 34' }
      - artifact: universe_comparison
        quote: { exact: '"n_sensors_ci95_excluding_zero": 30' }
